<svg width="144" height="144" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 - 更偏蓝色调 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6cf7"/>
      <stop offset="50%" stop-color="#5a7cff"/>
      <stop offset="100%" stop-color="#6a8cff"/>
    </linearGradient>
    <linearGradient id="lightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7a9cff"/>
      <stop offset="100%" stop-color="#8aacff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景圆形 - 纯蓝色调 -->
  <circle cx="72" cy="72" r="68" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- 记忆点核心设计 - 简化版 -->
  <g transform="translate(72, 72)">
    <!-- 主记忆点（大亮点） -->
    <circle cx="0" cy="0" r="20" fill="#ffffff" filter="url(#glow)" opacity="0.95">
      <animate attributeName="r" values="20;22;20" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 内层光晕 -->
    <circle cx="0" cy="0" r="16" fill="#e6f0ff" opacity="0.8"/>
    
    <!-- 中心高光 -->
    <circle cx="-4" cy="-4" r="6" fill="#ffffff" opacity="0.9"/>
    
    <!-- 记忆波纹（简化） -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="12;25;12" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    
    <!-- 知识节点（更分散布局） -->
    <g>
      <!-- 上方节点 -->
      <circle cx="0" cy="-40" r="4" fill="#ffffff" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 右上方节点 -->
      <circle cx="35" cy="-20" r="3" fill="#ffffff" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 右下方节点 -->
      <circle cx="35" cy="20" r="3" fill="#ffffff" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 下方节点 -->
      <circle cx="0" cy="40" r="4" fill="#ffffff" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.4;0.8" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 左下方节点 -->
      <circle cx="-35" cy="20" r="3" fill="#ffffff" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      
      <!-- 左上方节点 -->
      <circle cx="-35" cy="-20" r="3" fill="#ffffff" opacity="0.7">
        <animate attributeName="opacity" values="0.7;0.3;0.7" dur="1.9s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- 连接线（象征知识连接） -->
    <path d="M0,-40 L0,-20" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M35,-20 L25,-15" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M35,20 L25,15" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M0,40 L0,20" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M-35,20 L-25,15" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
    <path d="M-35,-20 L-25,-15" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- 外圈装饰（开源象征） -->
  <circle cx="72" cy="72" r="58" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  </svg>